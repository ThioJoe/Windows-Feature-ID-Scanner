# windows-scanner.yml
name: Windows Feature Scanner

on:
  workflow_dispatch:
  schedule:
    # Daily check for a new Windows build on the runner image. Scans only run when the build isn't in data/ yet.
    - cron: '17 6 * * *'

# Scans commit to data/, so never run two at once
concurrency:
  group: windows-scanner
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-11-arm
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether this build has already been scanned
        id: check
        shell: powershell
        run: |
          $osInfo = Get-CimInstance -ClassName Win32_OperatingSystem
          $regInfo = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $key = "$($osInfo.BuildNumber).$($regInfo.UBR)-$env:PROCESSOR_ARCHITECTURE"
          if (Test-Path "data\builds\$key.json") {
            Write-Host "Build $key is already in data/builds."
            echo "needed=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Build $key is new."
            echo "needed=true" >> $env:GITHUB_OUTPUT
          }

  scan:
    needs: check
    # Manual runs always scan; scheduled runs only when the runner has a build that isn't in data/ yet
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.needed == 'true'
    runs-on: windows-11-arm
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history so the data commit can be rebased onto the branch tip

      - name: Get Windows version and build info
        id: windows-info
        shell: powershell
        run: |
          $osInfo = Get-CimInstance -ClassName Win32_OperatingSystem
          $regInfo = Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          $build = $osInfo.BuildNumber
          $fullBuild = "$($osInfo.BuildNumber).$($regInfo.UBR)"
          $architecture = $env:PROCESSOR_ARCHITECTURE
          Write-Host "Base Build: $build"
          Write-Host "Full Build: $fullBuild"
          Write-Host "Architecture: $architecture"
          echo "build=$build" >> $env:GITHUB_OUTPUT
          echo "full_build=$fullBuild" >> $env:GITHUB_OUTPUT
          echo "architecture=$architecture" >> $env:GITHUB_OUTPUT

      - name: Download and Extract ViVeTool
        shell: powershell
        run: .\download-vivetool.ps1

      - name: Extract feature names from symbols
        shell: powershell
        run: |
          python --version
          python scan-symbols.py --results-cache data\symbol-cache.json --names-out extracted-names.txt --json-out symbol-features.json
          if ($LASTEXITCODE -ne 0) { Write-Error "scan-symbols.py failed with exit code $LASTEXITCODE"; exit 1 }
          Write-Host "Preview of the first 5 lines of extracted-names.txt:"
          Get-Content "extracted-names.txt" -TotalCount 5 | Out-Host

      - name: Run feature scanner script
        shell: powershell
        run: .\scan-features.ps1

      - name: Create output directory based on build version
        shell: powershell
        run: |
          $buildFolder = "output/Windows-Build-${{ steps.windows-info.outputs.full_build }}-${{ steps.windows-info.outputs.architecture }}"
          New-Item -ItemType Directory -Force -Path $buildFolder
          echo "BUILD_FOLDER=$buildFolder" >> $env:GITHUB_ENV

      - name: Copy output files to build-specific folder
        shell: powershell
        run: |
          if (Test-Path "extracted-names.txt") {
            Copy-Item -Path "extracted-names.txt" -Destination $env:BUILD_FOLDER -Force
          }
          if (Test-Path "symbol-features.json") {
            Copy-Item -Path "symbol-features.json" -Destination $env:BUILD_FOLDER -Force
          }
          if (Test-Path "output-temp\*") {
            Copy-Item -Path "output-temp\*" -Destination $env:BUILD_FOLDER -Recurse -Force
            Write-Host "Files copied to $env:BUILD_FOLDER"
            Get-ChildItem -Path $env:BUILD_FOLDER -Recurse
          } else {
            Write-Host "No output files found in output-temp directory"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scanner-output-build-${{ steps.windows-info.outputs.full_build }}-${{ steps.windows-info.outputs.architecture }}
          path: output/
          if-no-files-found: warn

      - name: Add build to data/ and commit
        shell: powershell
        run: |
          python update-data.py --summary "$env:BUILD_FOLDER\summary.json" --symbols "$env:BUILD_FOLDER\symbol-features.json"
          if ($LASTEXITCODE -ne 0) { Write-Error "update-data.py failed with exit code $LASTEXITCODE"; exit 1 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "No changes to data/."; exit 0 }
          git commit -q -m "Add feature data for build ${{ steps.windows-info.outputs.full_build }}-${{ steps.windows-info.outputs.architecture }}"
          git pull -q --rebase origin "${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "Rebase onto ${{ github.ref_name }} failed"; exit 1 }
          git push -q origin "HEAD:${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { Write-Error "Push failed"; exit 1 }

  # A push made with GITHUB_TOKEN doesn't trigger other workflows, so publish the site from here after new data is committed
  pages:
    needs: scan
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write