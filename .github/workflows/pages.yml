# pages.yml
# Publishes site/ together with data/ to GitHub Pages, and the files build-site-data.py derives from data/ for the site.
# Requires Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish Site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'data/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # When called from the scanner, check out the branch tip so the data it just committed is included
          ref: ${{ github.ref_name }}

      # The site gets the data except each build's details.json, which it loads from files derived from them instead, its Super God
      # Mode statistics, which it doesn't show, and the symbol caches, which only the scans use
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          rm -rf _site/data/builds/*/details.json _site/data/builds/*/super-god-mode _site/data/symbol-cache*.json
          python3 build-site-data.py --data data --out _site/derived

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
