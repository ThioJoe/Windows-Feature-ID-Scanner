# pages.yml
# Publishes site/ together with data/ to GitHub Pages, and the files build-site-data.py derives from data/ for the site.
# Requires Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish Site

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'data/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-again.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # When called from the scanner, check out the branch tip so the data it just committed is included
          ref: ${{ github.ref_name }}

      # The site gets the data except each build's details.json, which it loads from files derived from them instead, its Super God
      # Mode statistics, which it doesn't show, the symbol caches and each build's list of PDBs, which only the scans use, and each build's
      # feature trace run (trace.json), what the trace saw of each feature being in features.json
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data
          rm -rf _site/data/builds/*/details.json _site/data/builds/*/super-god-mode _site/data/builds/*/symbols.json _site/data/builds/*/trace.json _site/data/symbol-cache*.json
          python3 scripts/build-site-data.py --data data --out _site/derived

      # The images of the resource data in the assets branch whose files differ but whose pixels are the same, so that a comparison doesn't
      # count a PNG that was only compressed again as a changed image, and those that are almost all white, which the site shows on a darker
      # checkerboard (analyze-images.py). Without them, the site compares the files, and every image has the usual checkerboard.
      - name: Check out the images of the resource data
        id: assets
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: assets
          path: assets
          sparse-checkout: |
            icons
            cursors
            bitmaps
            images

      - name: Analyze the images
        if: steps.assets.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/images-venv"
          "$RUNNER_TEMP/images-venv/bin/pip" install -q pillow
          "$RUNNER_TEMP/images-venv/bin/python" scripts/analyze-images.py --assets assets --out _site/derived/images.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Deploying right after the upload can find no artifact in the run yet (GitHub lists it a moment later, as in the Symbol Catch-up
      # run of 2026-11-21), so a failed deploy is tried again after 30 seconds
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before deploying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy again
        id: deployment-again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
