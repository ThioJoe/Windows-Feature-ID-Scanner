# Temporary: tests whether GitHub's ARM64 runners can run a virtual machine. To be removed after one run.
name: ARM64 Virtualization Probe

on:
  push:
    branches:
      - claude/feature-trace
    paths:
      - '.github/workflows/arm-virtualization-probe.yml'

permissions: {}

jobs:
  windows-arm:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Hyper-V, WSL and the hypervisor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          "== OS"; Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber, OSArchitecture, LastBootUpTime
          "== Computer"; Get-CimInstance Win32_ComputerSystem | Format-List Manufacturer, Model, HypervisorPresent, NumberOfLogicalProcessors, TotalPhysicalMemory
          "== Processor"; Get-CimInstance Win32_Processor | Format-List Name, Manufacturer, VirtualizationFirmwareEnabled, VMMonitorModeExtensions, SecondLevelAddressTranslationExtensions
          "== Get-ComputerInfo"; Get-ComputerInfo -Property HyperV*, DeviceGuard* | Format-List
          "== Device Guard"; Get-CimInstance -Namespace root\Microsoft\Windows\DeviceGuard -ClassName Win32_DeviceGuard | Format-List VirtualizationBasedSecurityStatus, SecurityServicesRunning, SecurityServicesConfigured, AvailableSecurityProperties
          "== Optional features"; Get-WindowsOptionalFeature -Online | Where-Object { $_.FeatureName -match 'Hyper|VirtualMachine|HypervisorPlatform|Containers|Sandbox|Subsystem' } | Format-Table FeatureName, State -AutoSize | Out-String -Width 200
          "== Services"; Get-Service vmms, vmcompute, HvHost, LxssManager, WslService -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType -AutoSize
          "== bcdedit"; bcdedit /enum '{current}'
          "== systeminfo"; systeminfo
          "== WSL"; wsl.exe --status; wsl.exe --version; wsl.exe -l -v
          "== Hyper-V module"; Get-Command -Module Hyper-V -ErrorAction SilentlyContinue | Measure-Object | Select-Object Count
          if (Get-Command New-VM -ErrorAction SilentlyContinue) {
              try {
                  New-VM -Name probe -MemoryStartupBytes 512MB -Generation 2 -NoVHD -ErrorAction Stop | Out-Null
                  Start-VM -Name probe -ErrorAction Stop
                  Start-Sleep -Seconds 15
                  Get-VM -Name probe | Format-List Name, State, Uptime, Status
                  Stop-VM -Name probe -TurnOff -Force
              } catch { "New-VM/Start-VM failed: $_" }
          }
          "== Enable Hyper-V without restarting"
          try { Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All -All -NoRestart -ErrorAction Stop | Format-List } catch { "Enable-WindowsOptionalFeature failed: $_" }
          try { Enable-WindowsOptionalFeature -Online -FeatureName VirtualMachinePlatform -All -NoRestart -ErrorAction Stop | Format-List } catch { "Enable-WindowsOptionalFeature failed: $_" }
      - name: Apps in the runner image
        shell: powershell
        run: |
          "== Provisioned apps"; Get-AppxProvisionedPackage -Online | Sort-Object DisplayName | Format-Table DisplayName, Version -AutoSize | Out-String -Width 200
          "== Installed apps (all users)"; Get-AppxPackage -AllUsers | Sort-Object Name | Format-Table Name, Version, Architecture -AutoSize | Out-String -Width 200

  windows-arm-restart:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - name: Restart the runner
        shell: powershell
        run: |
          (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
          shutdown.exe /r /t 5 /f
          Start-Sleep -Seconds 120
          'Still running 120 seconds after the restart was scheduled'
      - name: After the restart
        shell: powershell
        run: |
          'The job continued after the restart'
          (Get-CimInstance Win32_OperatingSystem).LastBootUpTime

  linux-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: KVM
        run: |
          set -x
          uname -a
          lscpu
          systemd-detect-virt || true
          ls -l /dev/kvm || echo 'no /dev/kvm'
          lsmod | grep -i kvm || true
          grep -E '^CONFIG_KVM' "/boot/config-$(uname -r)" || true
          sudo dmesg | grep -i -E 'kvm|hyp mode|EL2|virtualization' | head -40 || true
          sudo modprobe kvm 2>&1 || true
          ls -l /dev/kvm || echo 'still no /dev/kvm'
      - name: QEMU with KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 > /dev/null
          sudo timeout 40 qemu-system-aarch64 -M virt -accel kvm -cpu host -m 512 -nographic -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd 2>&1 | tail -40 || true
          echo "exit: ${PIPESTATUS[0]}"

  macos-arm:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Hypervisor framework
        run: |
          sw_vers
          sysctl hw.model machdep.cpu.brand_string kern.hv_support kern.hv_vmm_present || true
          sysctl -a | grep -i -E '^kern.hv|hv_' || true
