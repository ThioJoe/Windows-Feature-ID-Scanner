# Temporary: how fast Microsoft's ARM64 Windows 11 image runs emulated (QEMU without hardware virtualization, which GitHub's ARM64
# runners don't have) on an x64 runner, against the same work natively on the ARM64 runner and on the x64 runner. To be removed.
name: ARM64 Emulation Test

on:
  push:
    branches:
      - claude/feature-trace
    paths:
      - '.github/workflows/arm64-emulation-test.yml'
      - '.github/arm64-emulation-test/**'

permissions:
  contents: read

jobs:
  native-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: The benchmark natively on the ARM64 runner
        shell: powershell
        run: |
          & .github\arm64-emulation-test\bench.ps1 -Out C:\armtest\results-native-arm64.txt -NoShutdown
          Get-Content C:\armtest\results-native-arm64.txt
      - uses: actions/upload-artifact@v7
        with:
          name: native-arm64
          path: C:\armtest\results-native-arm64.txt

  emulated:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - name: The benchmark natively on the x64 runner
        shell: powershell
        run: |
          & .github\arm64-emulation-test\bench.ps1 -Out D:\armtest\out\results-native-x64.txt -NoShutdown
          Get-Content D:\armtest\out\results-native-x64.txt
      - name: Prepare the ARM64 disk and QEMU
        shell: powershell
        run: '& .github\arm64-emulation-test\prep-arm.ps1'
      - name: Run the ARM64 VM emulated
        shell: powershell
        run: '& .github\arm64-emulation-test\emulate.ps1 -LimitMinutes 180'
      - name: Read the guest's results
        if: always()
        shell: powershell
        run: '& .github\arm64-emulation-test\collect.ps1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulated-arm64
          path: D:\armtest\out\
