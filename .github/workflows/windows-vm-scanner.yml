# windows-vm-scanner.yml
# Scans x64 Windows 11 builds inside a Hyper-V virtual machine on an x64 runner, so the build scanned doesn't depend on what the
# runner image has. The VM is built entirely from Microsoft's servers (see scan-in-vm.ps1). A daily check (check-windows-builds.py)
# finds the builds Microsoft has released for every Windows 11 version and Windows Insider channel, records them in
# data/releases.json for the site, and starts a scan for every build of the versions the VM can be built for that isn't in data/ yet.
name: Windows VM Feature Scanner

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'Windows 11 versions to scan, separated by spaces (empty: every version the VM can be built for)'
        default: ''
      builds:
        description: 'Specific builds to scan instead, separated by spaces, such as 26300.9725 (scanned even if they are in data/ already)'
        default: ''
      force:
        description: 'Scan the newest builds even if they are in data/ already'
        type: boolean
        default: false
  schedule:
    - cron: '41 8 * * *'

# Scans commit to data/, so never run at the same time as each other or the ARM64 scanner
concurrency:
  group: windows-scanner
  cancel-in-progress: false

# Placeholder for device/account information if the Insider setup ends up needing it (see Register-InsiderDevice in scan-in-vm.ps1).
# While WINDOWS_INSIDER_DEVICE is empty, Insider builds are listed but not scheduled.
env:
  INSIDER_DEVICE: ${{ secrets.WINDOWS_INSIDER_DEVICE }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      builds: ${{ steps.check.outputs.builds }}
      needed: ${{ steps.check.outputs.needed }}
      releases: ${{ steps.releases.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history so the commit can be rebased onto the branch tip

      - name: Find the released builds and those to scan
        id: check
        env:
          VERSIONS: ${{ inputs.versions }}
          BUILDS: ${{ inputs.builds }}
          FORCE: ${{ inputs.force && '--all' || '' }}
        run: python3 check-windows-builds.py --arch AMD64 ${VERSIONS:+--versions $VERSIONS} ${BUILDS:+--builds $BUILDS} $FORCE ${INSIDER_DEVICE:+--insider} --releases data/releases.json --summary "$GITHUB_STEP_SUMMARY" --github-output

      # The list only changes when Microsoft releases something
      - name: Commit the list of released builds
        id: releases
        run: |
          git add data/releases.json
          if git diff --cached --quiet; then echo "No change to data/releases.json"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update the list of released Windows builds"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  scan:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 340
    # The builds are scanned at the same time, each on its own runner; the commit job adds them all to data/ afterwards
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        build: ${{ fromJSON(needs.check.outputs.builds) }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}  # The branch tip: the symbol cache the scan starts from

      - name: Build the VM and scan inside it
        shell: powershell
        env:
          VERSION: ${{ matrix.build.version }}
          KB: ${{ matrix.build.kb }}
          BUILD: ${{ matrix.build.build }}
          CHANNEL: ${{ matrix.build.channel }}  # An Insider build's channel (empty for the released versions' builds)
        run: |
          python --version
          .\scan-in-vm.ps1 -Version $env:VERSION -Kb $env:KB -ExpectedBuild $env:BUILD -InsiderChannel $env:CHANNEL -OutputDir "$env:GITHUB_WORKSPACE\vm-output"

      # When a check of the VM fails, there's no scan output, but the reports of the checks say what was wrong
      - name: Upload the reports of the VM's checks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vm-checks-${{ matrix.build.key }}
          path: vm-output/
          if-no-files-found: ignore

      - name: Collect the output
        shell: powershell
        run: |
          $summary = Get-Content vm-output\summary.json -Raw | ConvertFrom-Json
          $key = "$($summary.fullBuild)-$($summary.architecture)"
          $buildFolder = "output/Windows-Build-$key"
          New-Item -ItemType Directory -Force -Path $buildFolder | Out-Null
          Copy-Item -Path vm-output\* -Destination $buildFolder -Recurse -Force
          Get-ChildItem -Path $buildFolder -Recurse
          echo "BUILD_FOLDER=$buildFolder" >> $env:GITHUB_ENV
          echo "BUILD_KEY=$key" >> $env:GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: scanner-output-build-${{ env.BUILD_KEY }}
          path: output/
          if-no-files-found: warn

      # The scan added what it found to its copy of the symbol cache (the PDBs it scanned); the commit job merges the copies
      - name: Upload the symbol cache
        uses: actions/upload-artifact@v7
        with:
          name: symbol-cache-${{ env.BUILD_KEY }}
          path: data/symbol-cache-AMD64.json
          if-no-files-found: error

  # Once every scan has finished or failed: the builds that were scanned go into data/ in one commit
  commit:
    needs: scan
    if: ${{ !cancelled() && needs.scan.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0  # Full history so the data commit can be rebased onto the branch tip

      - name: Download the scans' output
        uses: actions/download-artifact@v8
        with:
          pattern: scanner-output-build-*
          path: output
          merge-multiple: true

      - name: Download the scans' symbol caches
        uses: actions/download-artifact@v8
        with:
          pattern: symbol-cache-*
          path: symbol-caches

      # Oldest build first: update-data.py fills in a build's missing feature names from the earlier builds in data/
      - name: Add the builds to data/ and commit
        id: commit
        run: |
          set -euo pipefail
          keys=()
          while read -r folder; do
            key="${folder#output/Windows-Build-}"
            echo "Adding $key"
            python3 update-data.py --summary "$folder/summary.json" --symbols "$folder/symbol-features.json" --super-god-mode "$folder/super-god-mode"
            keys+=("$key")
          done < <(find output -mindepth 1 -maxdepth 1 -type d -name 'Windows-Build-*' 2>/dev/null | sort -t- -k3,3V)
          if [ ${#keys[@]} -eq 0 ]; then echo "No build was scanned."; echo "committed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # (A folder per scan's cache, though download-artifact can put a lone one straight in symbol-caches/)
          mapfile -t caches < <(find symbol-caches -type f -name symbol-cache-AMD64.json 2>/dev/null | sort)
          if [ ${#caches[@]} -gt 0 ]; then python3 merge-symbol-caches.py --out data/symbol-cache-AMD64.json "${caches[@]}"; else echo "No symbol cache came back from the scans"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes to data/."; echo "committed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ ${#keys[@]} -eq 1 ]; then message="Add feature data for build ${keys[0]}"; else message="Add feature data for builds $(IFS=,; echo "${keys[*]}" | sed 's/,/, /g')"; fi
          git commit -q -m "$message"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"
          echo "committed=true" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN doesn't trigger other workflows, so publish the site from here after new data is committed
  pages:
    needs: [check, commit]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.commit.outputs.committed == 'true' || needs.check.outputs.releases == 'true') }}
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
